#
# Proves the whole chain end to end against a live Blocks environment:
# script injection, the bootstrap script, the postMessage patch, the bridge
# and message parsing. If Blocks loads at all inside the WebView, the app's
# event log will show both APP_LOADED (the first message Blocks ever posts)
# and PAGE_VIEW (proof that navigation inside the WebView itself works).
#
# appId matches example/app.json's ios.bundleIdentifier and android.package
# (both "com.insurely.sdkdemo"). See e2e/README.md for how to build and run
# the app this flow drives.
appId: com.insurely.sdkdemo
---
# No clearState here on purpose. Maestro's launchApp already restarts the
# app's JS process, which is enough to give a clean event log (App.tsx's
# `entries` state is plain in-memory React state, not persisted). Adding
# clearState: true wipes the Expo dev-client's own "last opened project"
# pointer along with it, which lands the app on the dev-client's own
# development-servers picker screen instead of the playground -- see
# e2e/README.md.
- launchApp
# On a dev-client build, the very first launch after install (or after the
# app's storage has been cleared some other way) shows a one-time "This is
# the developer menu" onboarding tip over the playground UI. Both waits
# below are optional and bounded: once this tip has been dismissed on a
# given install it never reappears, so on every later run neither step
# does anything and the flow proceeds straight to "start-collection".
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 10000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Tapping "Continue" (when the tip was showing) reveals the dev-client's
# full menu (Reload / Go home / Tools...), which stays open until
# dismissed. Close it with the back button, but only when it is actually
# open -- pressing back with no menu open would exit the app instead of
# doing nothing.
- runFlow:
    when:
      visible:
        text: "Reload"
    commands:
      - back
# testID="start-collection" on the "Start collection" button in
# example/src/SettingsPanel.tsx. It sits below the fold in the settings
# scroll view, and UIAutomator only reports nodes that are actually on
# screen, so it has to be scrolled into view before it can be asserted on
# or tapped. Confirmed against the installed Maestro 2.8.0's own
# YamlScrollUntilVisible model class (decompiled the same way as the
# extendedWaitUntil fix above): the command is `scrollUntilVisible`,
# taking `element` (the same selector shape as tapOn/assertVisible) plus
# `direction` (default DOWN, made explicit here) and `timeout` (ms).
- scrollUntilVisible:
    element:
      id: "start-collection"
    direction: DOWN
    timeout: 15000
# A short bounded wait covers the settle time after the steps above (and
# after the scroll), not a live Blocks round-trip.
- extendedWaitUntil:
    visible:
      id: "start-collection"
    timeout: 15000
- tapOn:
    id: "start-collection"
# InsurelyEvent's "APP_LOADED" member (src/types/events.ts) is rendered
# verbatim as the log row's label in example/src/App.tsx, since its type is
# not "UNKNOWN". This waits on a live Blocks round-trip, hence the
# generous bound.
- extendedWaitUntil:
    visible:
      text: "APP_LOADED"
    timeout: 30000
# InsurelyEvent's "PAGE_VIEW" member, same rendering path. Its presence
# means the WebView actually navigated to a real Blocks page.
- extendedWaitUntil:
    visible:
      text: "PAGE_VIEW"
    timeout: 30000
