# Step 1 of 3 — prepare a release.
#
# Bumps the version and regenerates the changelog from conventional commits,
# then pushes a `release/X.Y.Z` branch. Nothing is tagged and nothing is
# published here; release-pr.yml opens a PR from that branch, and publish.yml
# publishes only once the PR is merged.
#
# main is never pushed by this workflow. The release commit reaches main only
# through the reviewed PR.
name: Release — prepare

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump. "auto" reads the conventional commits since the last release.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      allow_major:
        description: 'Required to leave 0.x, or to bump an existing major. Semver then binds you: any later breaking change needs the next major.'
        type: boolean
        default: false

permissions:
  # contents: push the release branch.  pull-requests: open the release PR.
  # The repository default is read-only, so anything missing here fails at
  # the step that needs it.
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Bump version and push release branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-it derives the changelog from history, so a shallow clone
          # would silently produce an empty or truncated one.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record the version we start from
        id: before
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Bump version and write the changelog
        # Everything except the version bump, the changelog and the commit is
        # switched off: no tag, no push, no publish, no GitHub release. Those
        # belong to publish.yml, after a human has merged the PR.
        run: |
          yarn release-it ${{ inputs.increment == 'auto' && '' || inputs.increment }} \
            --ci \
            --no-git.tag \
            --no-git.push \
            --no-npm.publish \
            --no-github.release

      - name: Read the new version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Refuse an unintended major bump
        # A major bump is a product decision, not something a stray
        # `BREAKING CHANGE:` footer should be able to trigger. This catches
        # both directions: leaving 0.x, where the API is still allowed to
        # move, and any later major, where consumers must act to upgrade.
        run: |
          OLD="${{ steps.before.outputs.version }}"
          NEW="${{ steps.version.outputs.version }}"
          OLD_MAJOR="${OLD%%.*}"
          NEW_MAJOR="${NEW%%.*}"
          if [ "$OLD_MAJOR" != "$NEW_MAJOR" ] && [ "${{ inputs.allow_major }}" != "true" ]; then
            echo "::error::Refusing to release $NEW: that is a major bump from $OLD."
            echo "::error::Re-run with 'allow_major' checked if this is intended."
            exit 1
          fi

      - name: Fail if nothing changed
        run: |
          if [ "${{ steps.before.outputs.version }}" = "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Version is unchanged (${{ steps.version.outputs.version }})."
            echo "::error::There is probably nothing releasable since the last release."
            exit 1
          fi

      - name: Push the release branch
        run: |
          BRANCH="release/${{ steps.version.outputs.version }}"
          git branch "$BRANCH"
          git push origin "$BRANCH"

      - name: Open the release PR
        # This used to be release-pr.yml's job, triggered by the push above.
        # It never fired: GitHub ignores workflow triggers caused by its own
        # GITHUB_TOKEN, so a branch pushed by this workflow starts nothing.
        # Opening the PR here removes the dependency on that event.
        #
        # The PR is authored by github-actions[bot], which is not a repository
        # collaborator, so its workflow runs wait for a maintainer to click
        # "Approve and run" on the PR. That approval is the point at which CI
        # starts -- see docs/development.md.
        #
        # release-pr.yml still exists for a release branch pushed by a person,
        # where the push event does fire; its create-or-skip check keeps the
        # two from opening duplicate PRs.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          BRANCH="release/${{ steps.version.outputs.version }}"
          VERSION="${{ steps.version.outputs.version }}"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING is already open for $BRANCH."
          else
            sed "s/__VERSION__/$VERSION/g" .github/release-pr-body.md > "$RUNNER_TEMP/body.md"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "release: $VERSION" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Summary
        run: |
          V="${{ steps.version.outputs.version }}"
          {
            echo "## Release $V prepared"
            echo
            echo "- **From:** ${{ steps.before.outputs.version }}"
            echo "- **To:** $V"
            echo "- **Branch:** \`release/$V\`"
            echo
            echo "A pull request has been opened."
            echo
            echo "Its checks wait for approval, because the PR is authored by"
            echo "github-actions[bot]: open it and click **Approve and run**."
            echo "Then review the changelog, wait for the checks, and merge —"
            echo "**merging is what publishes to npm.**"
          } >> "$GITHUB_STEP_SUMMARY"
