# Step 3 of 3 — publish.
#
# Fires when a `release/*` PR is merged into main. Publishing to the public npm
# registry is irreversible: `npm unpublish` works only within 72 hours and only
# while nothing depends on the package. So three things stand in front of it:
#
#   1. a reviewed pull request, which the ruleset on main requires
#   2. the full CI suite, re-run here rather than trusted from the PR
#   3. a guard that the tag does not already exist
#
# Publishing uses npm trusted publishing (OIDC), so there is no NPM_TOKEN and
# no long-lived credential to rotate, leak, or lose when someone leaves. npm
# is configured to trust this repository, this workflow file, and this
# environment; the runner exchanges a short-lived OIDC token at publish time.
#
# The npmjs.com side must name this file exactly (`publish.yml`). Renaming it
# breaks publishing until the trusted-publisher config is updated to match --
# and that filename pin is also what stops another workflow from publishing.
name: Release — publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Re-runs .github/workflows/ci.yml in full -- typecheck, lint, tests, the
  # tarball check, the packaged and bare-RN installs, and both native builds.
  # Calling the real workflow rather than copying its steps means this gate
  # cannot drift away from what CI actually checks.
  verify:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/ci.yml

  # Runs alongside verify so a mismatch is caught in seconds rather than after
  # the full native-build suite.
  #
  # publish.yml checks out main, so it ships whatever main holds when it runs.
  # The changelog, though, was generated back when `Release -- prepare` ran.
  # Anything merged in between would be published inside this version without
  # appearing in its changelog -- the version, the changelog and the tarball
  # would disagree, and nothing else would notice: the release PR's checks ran
  # on the release branch, before that code existed.
  #
  # Merging the release branch produces a tree identical to the branch's own
  # tree only when nothing else landed in between. So compare them.
  changelog-covers-what-ships:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    name: Check nothing merged behind the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compare the published tree against the reviewed one
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --quiet "$HEAD_SHA" HEAD; then
            echo "main matches the reviewed release branch; the changelog covers what ships."
            exit 0
          fi

          echo "::error::Something merged into main after this release was prepared."
          echo "::error::These files differ from what was reviewed and changelogged:"
          git diff --name-only "$HEAD_SHA" HEAD | sed 's/^/::error::  /'
          echo "::error::"
          echo "::error::Nothing has been published and no tag was created."
          echo "::error::To recover: run 'Release -- prepare' again. It will bump to the"
          echo "::error::next version and regenerate the changelog covering these commits"
          echo "::error::too. Merging that PR publishes. The version prepared here is"
          echo "::error::simply skipped -- it was never published, so the number is free"
          echo "::error::to abandon."
          exit 1

  publish:
    name: Publish to npm
    needs: [verify, changelog-covers-what-ships]
    runs-on: ubuntu-latest
    # Deliberately no `environment:`. Merging the release PR is the human
    # gate -- it cannot happen without a review of the version bump and the
    # changelog, and the ruleset on main requires all five CI checks to pass
    # first. A second approval seconds later, by the same person on the same
    # information, added little.
    #
    # Declaring an environment that does not exist is worse than declaring
    # none: GitHub creates it silently on first use with no protection rules,
    # so the config would imply a gate that is not there.
    #
    # Adding one later is a two-line change plus the Environment field on the
    # npmjs trusted publisher -- worth doing once a second maintainer can
    # approve, since GitHub forbids approving your own PR but allows approving
    # your own deployment.
    permissions:
      contents: write
      # This is what authenticates the publish. npm exchanges the OIDC token
      # it grants for a short-lived credential, and uses it to attach a
      # provenance attestation tying the tarball to this repo and commit.
      # Without it there is no way to publish at all -- there is no token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit, not the PR head -- this is what main now is.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          # Node 20 ships npm 10, which has no OIDC support -- it would fail
          # asking for credentials that no longer exist.
          node-version: 22
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      - run: corepack enable
      - run: yarn install --immutable

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"
          node -e '
            const [maj, min, pat] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error(`::error::Node ${process.versions.node} is below the 22.14.0 that trusted publishing requires.`);
              process.exit(1);
            }
          '

      - name: Read the version being published
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish an existing version
        # npm would reject this anyway, but failing here says why, and avoids
        # burning the environment approval on a run that cannot succeed.
        run: |
          V="${{ steps.version.outputs.version }}"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists — $V looks already released."
            exit 1
          fi
          if npm view "@insurely/react-native-sdk@$V" version >/dev/null 2>&1; then
            echo "::error::@insurely/react-native-sdk@$V is already on the registry."
            echo "::error::Published versions cannot be replaced. Cut a new version instead."
            exit 1
          fi

      - name: Build
        # `prepare` is bob's build. yarn install already ran it, but running it
        # explicitly means the published artefact is built from this checkout,
        # not from whatever install happened to leave behind.
        run: yarn prepare

      - name: Check the tarball one last time
        # Same check CI runs. It is cheap, and this is the final moment before
        # the contents become permanent.
        run: yarn check-tarball

      - name: Publish
        env:
          # Bootstrap only. npm's trusted-publisher config lives under package
          # settings, so it cannot be created for a package that does not
          # exist yet -- there is no pending-publisher flow. The first release
          # therefore needs a token; after it, configure trusted publishing on
          # the now-existing package and DELETE this secret. With the secret
          # gone this is empty and npm falls back to OIDC, so the token path
          # disappears on its own rather than lingering as a second way in.
          #
          # With no environment there is nowhere to scope this to, so it is a
          # repository secret while it exists. Workflows triggered by fork PRs
          # do not receive secrets, so it stays out of untrusted runs -- but
          # delete it as soon as trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # After the bootstrap there is no token: the id-token permission above
        # lets npm exchange a short-lived OIDC credential. Provenance attestations are generated
        # automatically when publishing this way, so NPM_CONFIG_PROVENANCE is
        # not set -- though the attestation itself only appears once the
        # repository is public.
        #
        # --access public stays: scoped packages default to restricted.
        #
        # The scoped --@insurely:registry flag is not redundant. For a scoped
        # package, an `@scope:registry` line in any .npmrc beats both
        # publishConfig.registry AND an explicit --registry flag; only the
        # scoped flag overrides it. Insurely laptops map @insurely to GitHub
        # Packages for @insurely/ui, so without this a publish run anywhere
        # that config exists would go to the wrong registry and say so only in
        # a notice line. Runners are clean today; this keeps it true.
        run: |
          npm publish --access public \
            --@insurely:registry=https://registry.npmjs.org/

      - name: Tag the release
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" \
            --title "v$V" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the changes in this release."

      - name: Summary
        run: |
          V="${{ steps.version.outputs.version }}"
          {
            echo "## Published @insurely/react-native-sdk@$V"
            echo
            echo "- https://www.npmjs.com/package/@insurely/react-native-sdk/v/$V"
            echo "- Tagged \`v$V\`"
          } >> "$GITHUB_STEP_SUMMARY"
